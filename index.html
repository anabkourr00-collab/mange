<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08070c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trick Notes">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<title>Trick Notes</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');
:root{--bg:#07070b;--surface:#0f0f16;--surface2:#15151e;--surface3:#1b1a25;--text:#f7f5fb;--muted:#92909d;--line:#262532;--purple:#8d6cff;--purple2:#6245d6;--glow:#8061ff33;--green:#55d6a0;--red:#e46a7c}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;color:var(--text);font-family:Cairo,system-ui,sans-serif;background:radial-gradient(700px 350px at 85% -10%,#4d328b35,transparent 65%),radial-gradient(500px 300px at -10% 30%,#2e1d5b20,transparent 70%),var(--bg)}
button,input{font:inherit}button{border:0;color:inherit;cursor:pointer}
.app{max-width:980px;margin:auto;min-height:100vh;padding-bottom:110px}
.header{position:sticky;top:0;z-index:20;padding:18px 18px 14px;background:#07070bcc;backdrop-filter:blur(24px);border-bottom:1px solid #ffffff09}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:11px}.logo{width:43px;height:43px;border-radius:14px;background:linear-gradient(145deg,#a18aff,#6345d7);display:grid;place-items:center;box-shadow:0 10px 35px #7556ef35}.logo svg{width:23px}.brandname{font-size:18px;font-weight:800;line-height:1}.tag{font-size:10px;color:#8d889a;margin-top:5px}
.install{display:none;padding:10px 14px;border-radius:13px;background:#f3f0ff;color:#171321;font-size:12px;font-weight:800}
main{padding:28px 17px}.hero{margin-bottom:28px}.eyebrow{color:#9e8aff;font-size:12px;font-weight:700;letter-spacing:.3px}.hero h1{font-size:31px;line-height:1.25;margin:6px 0 7px;letter-spacing:-.7px}.hero p{color:var(--muted);font-size:13px;margin:0}
.sectionbar{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px}.sectionbar h2{font-size:17px;margin:0}.sectionbar span{font-size:11px;color:#777482}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:13px}
.folder{position:relative;overflow:hidden;min-height:155px;text-align:right;padding:19px;border-radius:24px;background:linear-gradient(145deg,#15141d,#0e0e14);border:1px solid #ffffff0b;box-shadow:0 12px 40px #0003;transition:.22s}
.folder:before{content:"";position:absolute;width:120px;height:120px;border-radius:50%;background:var(--glow);filter:blur(18px);top:-55px;left:-40px}.folder:active{transform:scale(.975)}
.folderIcon{width:43px;height:43px;border-radius:14px;background:#8d6cff17;border:1px solid #9a82ff20;display:grid;place-items:center;margin-bottom:24px}.folderIcon svg{width:22px}.folderName{font-size:16px;font-weight:800;position:relative}.folderMeta{font-size:11px;color:#777482;margin-top:4px;position:relative}
.empty{border:1px dashed #312e3b;border-radius:24px;padding:42px 20px;text-align:center;color:#7f7b88;font-size:13px}
.fab{position:fixed;z-index:30;right:22px;bottom:24px;width:62px;height:62px;border-radius:21px;background:linear-gradient(145deg,#a18aff,#6548da);box-shadow:0 16px 45px #6d4de955;display:grid;place-items:center}.fab svg{width:26px}
.folderHeader{display:flex;align-items:center;gap:10px;margin-bottom:22px}.back{width:42px;height:42px;border-radius:14px;background:#121119;border:1px solid var(--line);display:grid;place-items:center}.back svg{width:19px}.folderBig{width:46px;height:46px;border-radius:15px;background:#8d6cff18;display:grid;place-items:center}.folderBig svg{width:23px}.folderTitle{font-size:21px;font-weight:800}.folderSub{font-size:11px;color:var(--muted);margin-top:2px}
.addQuestion{margin-right:auto;background:#eeeaff;color:#191523;border-radius:13px;padding:10px 13px;font-size:11px;font-weight:800;display:flex;gap:5px;align-items:center}.addQuestion svg{width:15px}
.trick{overflow:hidden;border-radius:25px;background:linear-gradient(145deg,#121119,#0c0c12);border:1px solid #ffffff0b;margin:14px 0;box-shadow:0 14px 50px #0003}.imageWrap{padding:8px;background:#09090d}.imageWrap img{width:100%;max-height:600px;display:block;object-fit:contain;border-radius:19px;background:#050507}
.trickBottom{padding:14px 15px 15px}.qtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.qnumber{font-size:11px;color:#85818d}.status{font-size:10px;padding:5px 9px;border-radius:9px;background:#55d6a012;color:#63d9aa;border:1px solid #55d6a015}.status.none{color:#85818d;background:#ffffff05}
.audioRow{display:flex;gap:9px;align-items:center}.audioBtn{flex:1;min-height:47px;border-radius:15px;background:#191822;border:1px solid #2a2834;display:flex;align-items:center;gap:10px;padding:7px 11px;text-align:right}.audioIcon{width:32px;height:32px;border-radius:11px;background:#8d6cff20;color:#a18dff;display:grid;place-items:center;flex:none}.audioIcon svg{width:16px}.audioText{font-size:11px;font-weight:700}.audioHint{font-size:9px;color:#777482;margin-top:1px}.delete{width:45px;height:45px;border-radius:14px;background:transparent;color:#77737e}.delete:hover{color:var(--red);background:#e46a7c0c}
dialog{width:min(440px,calc(100% - 28px));padding:0;border:1px solid #34313f;border-radius:27px;background:#111017;color:var(--text);box-shadow:0 30px 100px #000d}dialog::backdrop{background:#000b;backdrop-filter:blur(9px)}.modal{padding:23px}.modalHead{display:flex;justify-content:space-between;align-items:start}.modal h3{margin:0;font-size:20px}.close{background:#1c1a23;border-radius:11px;width:34px;height:34px}.field{margin:20px 0}.field span{font-size:11px;color:#9a96a4;display:block;margin-bottom:8px}.field input{width:100%;background:#09090d;border:1px solid #2c2935;color:#fff;border-radius:15px;padding:13px;outline:none}.filebox{border:1px dashed #383441;border-radius:17px;padding:20px;text-align:center;color:#8d8995;font-size:12px}.filebox input{margin-top:10px}.modalBtns{display:flex;gap:9px}.modalBtns button{flex:1;padding:13px;border-radius:14px;font-weight:750}.primary{background:#eeeaff;color:#18131f}.secondary{background:#211f28}
.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);opacity:0;z-index:50;background:#25222e;border:1px solid #3b3746;border-radius:14px;padding:10px 15px;font-size:11px;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.screen{display:none}.screen.active{display:block}
@media(max-width:480px){.hero h1{font-size:27px}.grid{grid-template-columns:1fr 1fr}.folder{min-height:145px;padding:16px}.addQuestion{padding:9px}.addQuestion span{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="headrow"><div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v16H7.5A2.5 2.5 0 0 0 5 21.5v-16Z"/><path d="M5 18.5A2.5 2.5 0 0 1 7.5 16H19"/></svg></div><div><div class="brandname">Trick Notes</div><div class="tag">Your personal trick library</div></div></div><button id="installBtn" class="install">تثبيت</button></div></header>
<main>
<section id="home" class="screen active"><div class="hero"><div class="eyebrow">مكتبة المذاكرة</div><h1>احفظ التريكة،<br>ومتنساش الفكرة.</h1><p>صور الأسئلة وتسجيلاتك الصوتية في مكان واحد.</p></div><div class="sectionbar"><h2>ملفاتك</h2><span id="folderCount"></span></div><div id="folders" class="grid"></div></section>
<section id="folderScreen" class="screen"><div class="folderHeader"><button class="back" id="backBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button><div class="folderBig"><svg viewBox="0 0 24 24" fill="none" stroke="#a28cff" stroke-width="1.8"><path d="M3.5 6.5A2.5 2.5 0 0 1 6 4h4l2 2h6a2.5 2.5 0 0 1 2.5 2.5v8A2.5 2.5 0 0 1 18 19H6a2.5 2.5 0 0 1-2.5-2.5v-10Z"/></svg></div><div><div id="folderTitle" class="folderTitle"></div><div id="folderSub" class="folderSub"></div></div><button class="addQuestion" id="addTrickBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M12 5v14M5 12h14"/></svg><span>سؤال</span></button></div><div id="tricks"></div></section>
</main></div>
<button id="plus" class="fab"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg></button><div id="toast" class="toast"></div>
<dialog id="folderDialog"><form method="dialog" class="modal"><div class="modalHead"><h3>ملف جديد</h3><button type="button" class="close" onclick="folderDialog.close()">×</button></div><label class="field"><span>اسم المادة</span><input id="folderName" placeholder="مثلاً: فيزياء" required></label><div class="modalBtns"><button value="cancel" class="secondary">إلغاء</button><button id="createFolder" value="default" class="primary">إنشاء الملف</button></div></form></dialog>
<dialog id="trickDialog"><form method="dialog" class="modal"><div class="modalHead"><h3>إضافة سؤال</h3><button type="button" class="close" onclick="trickDialog.close()">×</button></div><label class="field"><span>صورة السؤال</span><div class="filebox">اختار صورة السؤال<br><input id="imageInput" type="file" accept="image/*" required></div></label><div class="modalBtns"><button value="cancel" class="secondary">إلغاء</button><button id="saveTrick" value="default" class="primary">حفظ السؤال</button></div></form></dialog>
<script>
const DB='TrickNotesPremium',VER=1;let db,currentFolder,mediaRecorder,chunks,deferredPrompt;
const $=x=>document.getElementById(x);const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function req(r){return new Promise((a,b)=>{r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)})}
function store(n,m='readonly'){return db.transaction(n,m).objectStore(n)} function all(n){return req(store(n).getAll())} function put(n,v){return req(store(n,'readwrite').put(v))} function remove(n,id){return req(store(n,'readwrite').delete(id))}
function openDB(){return new Promise((a,b)=>{let r=indexedDB.open(DB,VER);r.onupgradeneeded=()=>{let d=r.result;d.objectStoreNames.contains('folders')||d.createObjectStore('folders',{keyPath:'id'});if(!d.objectStoreNames.contains('tricks')){let s=d.createObjectStore('tricks',{keyPath:'id'});s.createIndex('folderId','folderId')}d.objectStoreNames.contains('media')||d.createObjectStore('media',{keyPath:'id'})};r.onsuccess=()=>{db=r.result;a()};r.onerror=()=>b(r.error)})}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
const folderSVG=`<svg viewBox="0 0 24 24" fill="none" stroke="#a28cff" stroke-width="1.8"><path d="M3.5 6.5A2.5 2.5 0 0 1 6 4h4l2 2h6a2.5 2.5 0 0 1 2.5 2.5v8A2.5 2.5 0 0 1 18 19H6a2.5 2.5 0 0 1-2.5-2.5v-10Z"/></svg>`;
async function renderFolders(){let fs=await all('folders'),ts=await all('tricks'),b=$('folders');b.innerHTML='';$('folderCount').textContent=fs.length?fs.length+' ملفات':'';if(!fs.length){b.innerHTML='<div class="empty">ابدأ بأول ملف ليجمع كل تريكاتك في مكان واحد.<br><br>اضغط + وأنشئ «فيزياء» مثلاً.</div>';return}fs.sort((a,b)=>a.created-b.created).forEach(f=>{let n=ts.filter(x=>x.folderId===f.id).length,c=document.createElement('button');c.className='folder';c.innerHTML=`<div class="folderIcon">${folderSVG}</div><div class="folderName"></div><div class="folderMeta">${n} ${n===1?'سؤال':'أسئلة'}</div>`;c.querySelector('.folderName').textContent=f.name;c.onclick=()=>openFolder(f.id);b.appendChild(c)})}
async function openFolder(id){currentFolder=id;let f=(await all('folders')).find(x=>x.id===id);$('folderTitle').textContent=f.name;$('home').classList.remove('active');$('folderScreen').classList.add('active');renderTricks()}
async function renderTricks(){let ts=(await all('tricks')).filter(x=>x.folderId===currentFolder).sort((a,b)=>a.created-b.created),b=$('tricks');b.innerHTML='';$('folderSub').textContent=ts.length+' '+(ts.length===1?'سؤال محفوظ':'أسئلة محفوظة');if(!ts.length){b.innerHTML='<div class="empty">مفيش أسئلة هنا لسه.<br>أضف أول صورة، وبعدها سجل التريكة بصوتك.</div>';return}for(let i=0;i<ts.length;i++){let t=ts[i],m=await req(store('media').get(t.imageId)),url=URL.createObjectURL(m.blob),d=document.createElement('article');d.className='trick';d.innerHTML=`<div class="imageWrap"><img src="${url}" alt="سؤال ${i+1}"></div><div class="trickBottom"><div class="qtop"><span class="qnumber">السؤال ${String(i+1).padStart(2,'0')}</span><span class="status ${t.audioId?'':'none'}">${t.audioId?'● تريكة محفوظة':'بدون تسجيل'}</span></div><div class="audioRow"><button class="audioBtn"><span class="audioIcon">${t.audioId?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 5v14l11-7-11-7Z"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M8 6v12M16 6v12"/></svg>'}</span><span><div class="audioText">${t.audioId?'تشغيل التريكة الصوتية':'تسجيل تريكة صوتية'}</div><div class="audioHint">${t.audioId?'اضغط للاستماع':'اضغط وابدأ التسجيل'}</div></span></button><button class="delete">حذف</button></div></div>`;d.querySelector('.audioBtn').onclick=()=>audioAction(t);d.querySelector('.delete').onclick=async()=>{if(confirm('حذف السؤال والتسجيل؟')){await remove('tricks',t.id);await remove('media',t.imageId);if(t.audioId)await remove('media',t.audioId);renderTricks()}};b.appendChild(d)}}
async function audioAction(t){if(t.audioId){let m=await req(store('media').get(t.audioId));new Audio(URL.createObjectURL(m.blob)).play();return}try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];mediaRecorder=new MediaRecorder(stream);toast('جاري التسجيل... اضغط الزر مرة ثانية للإيقاف');let card=[...document.querySelectorAll('.audioBtn')].find(x=>x.closest('.trick')?.querySelector('.qnumber')?.textContent.includes(String((await all('tricks')).filter(x=>x.folderId===currentFolder).sort((a,b)=>a.created-b.created).findIndex(x=>x.id===t.id)+1).padStart(2,'0')));mediaRecorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);mediaRecorder.onstop=async()=>{stream.getTracks().forEach(x=>x.stop());let aid=uid();await put('media',{id:aid,blob:new Blob(chunks,{type:mediaRecorder.mimeType||'audio/webm'})});t.audioId=aid;await put('tricks',t);mediaRecorder=null;toast('تم حفظ التريكة ✓');renderTricks()};mediaRecorder.start();setTimeout(()=>{if(mediaRecorder?.state==='recording'){mediaRecorder.stop()}},120000)}catch(e){toast('اسمح باستخدام الميكروفون أولاً')}}
$('plus').onclick=()=>folderDialog.showModal();$('createFolder').onclick=async e=>{e.preventDefault();let n=$('folderName').value.trim();if(!n)return;await put('folders',{id:uid(),name:n,created:Date.now()});$('folderName').value='';folderDialog.close();renderFolders()};
$('backBtn').onclick=()=>{$('folderScreen').classList.remove('active');$('home').classList.add('active');renderFolders()};$('addTrickBtn').onclick=()=>trickDialog.showModal();$('saveTrick').onclick=async e=>{e.preventDefault();let f=$('imageInput').files[0];if(!f)return;let iid=uid();await put('media',{id:iid,blob:f});await put('tricks',{id:uid(),folderId:currentFolder,imageId:iid,created:Date.now()});$('imageInput').value='';trickDialog.close();renderTricks();toast('تم حفظ السؤال ✓')};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('installBtn').style.display='block'});$('installBtn').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('installBtn').style.display='none'}else toast('استخدم قائمة المتصفح واختر تثبيت التطبيق')};window.addEventListener('appinstalled',()=>{$('installBtn').style.display='none';toast('تم تثبيت التطبيق ✓')});
(async()=>{await openDB();await renderFolders();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})})();
</script></body></html>
